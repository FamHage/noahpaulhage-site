<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sketchbook 1 by Noah Paul Hage." />
    <title>Sketchbook 1 — Noah Paul Hage</title>
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="stylesheet" href="sketchbooks.css" />
  </head>
  <body>
    <main class="sketchbook-viewer" aria-label="Sketchbook 1">
      <a class="return-home" href="../" aria-label="Return to homepage" data-page-link><img src="../images/return-home-button.png" alt="" /></a>
      <p class="sketchbook-counter" aria-live="polite"><span data-current>1</span>/<span data-total>35</span></p>
      <section class="page-stage" aria-label="Sketchbook pages">
        <button class="page-preview page-preview--previous" type="button" data-previous aria-label="Previous page" hidden><img src="" alt="" /></button>
        <button class="current-page" type="button" data-current-page aria-haspopup="dialog" aria-label="Open page index card"><img src="" alt="" /></button>
        <button class="page-preview page-preview--next" type="button" data-next aria-label="Next page" hidden><img src="" alt="" /></button>
      </section>
      <section class="page-card-backdrop" data-card-backdrop hidden>
        <aside class="page-card" data-page-card role="dialog" aria-modal="true" aria-labelledby="page-card-title">
          <button class="page-card__close" type="button" data-close-card aria-label="Close page index card">×</button>
          <p class="page-card__eyebrow">ARCHIVAL INDEX</p>
          <h1 id="page-card-title" data-card-title></h1>
          <dl>
            <div><dt>Sketchbook</dt><dd data-card-sketchbook></dd></div><div><dt>Page</dt><dd data-card-number></dd></div><div><dt>Date</dt><dd data-card-date></dd></div>
            <div><dt>Medium / materials</dt><dd data-card-medium></dd></div><div><dt>Process</dt><dd data-card-process></dd></div>
            <div><dt>Context</dt><dd data-card-context></dd></div><div><dt>Notes</dt><dd data-card-notes></dd></div>
          </dl>
        </aside>
      </section>
      <audio data-page-flip preload="auto" src="../audio/page-flip.wav"></audio>
    </main>
    <script src="sketchbooks-data.js"></script><script src="sketchbooks.js"></script><script src="../site-transition.js"></script>
  </body>
</html>
