<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Noah Paul Hage." />
    <title>Noah Paul Hage</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
