<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Noah Paul Hage." />
    <title>Noah Paul Hage</title>
    <link rel="icon" href="favicon-bridgeig.png" type="image/png" sizes="512x512" />
    <link rel="shortcut icon" href="favicon-bridgeig.png" type="image/png" />
    <link rel="apple-touch-icon" href="favicon-bridgeig.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="homepage" aria-label="Noah Paul Hage">
      <a class="homepage__logo" href="aboutme/" aria-label="About Noah Paul Hage" data-page-link>
        <img src="images/homepage-noah-paul-hage.png" alt="Noah Paul Hage" />
      </a>
      <a class="homepage__link homepage__link--art" href="art/" aria-label="Art" data-page-link>
        <img src="images/homepage-art.png" alt="" />
      </a>
      <a class="homepage__link homepage__link--photos" href="photos/" aria-label="Photos" data-page-link>
        <img src="images/homepage-photos.png" alt="" />
      </a>
      <a class="homepage__link homepage__link--looks" href="looks/" aria-label="Looks" data-page-link>
        <img src="images/homepage-looks.png" alt="" />
      </a>
      <a class="homepage__link homepage__link--embroidery" href="embroidery/" aria-label="Embroidery" data-page-link>
        <img src="images/homepage-embroidery.png" alt="" />
      </a>
    </main>
    <section class="sketchbook-section" aria-label="Sketchbooks">
      <img
        class="sketchbook-section__atmosphere"
        src="images/sketchbooks/homepage-scroll-sketchbook.png"
        alt=""
        aria-hidden="true"
      />
      <div class="sketchbook-section__composition">
        <img
          class="sketchbook-section__title"
          src="images/sketchbooks/scroll middle - sketchbooks text.png"
          alt="Sketchbooks"
        />
        <a class="sketchbook-section__thumbnail" href="sketchbooks/" data-page-link aria-label="Open Sketchbook 1">
          <img src="images/sketchbooks/scroll bottom left - sketchbook 1.png" alt="" />
        </a>
      </div>
    </section>
    <section class="touchme-section" aria-label="Touch Me">
      <a class="touchme-section__link" href="touchme/" aria-label="Open Touch Me" data-page-link>
        <img src="images/touchme/touch-me-button.png" alt="Touch Me" />
      </a>
    </section>
    <script src="site-transition.js"></script>
  </body>
</html>
