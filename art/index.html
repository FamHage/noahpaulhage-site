<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Art by Noah Paul Hage." />
    <title>Art — Noah Paul Hage</title>
    <link rel="icon" href="../favicon-bridgeig.png" type="image/png" sizes="512x512" />
    <link rel="shortcut icon" href="../favicon-bridgeig.png" type="image/png" />
    <link rel="apple-touch-icon" href="../favicon-bridgeig.png" />
    <link rel="stylesheet" href="art.css" />
  </head>
  <body>
    <main class="art-page" aria-label="Art archive">
      <a class="art-home" href="../" aria-label="Return to homepage" data-page-link>
        <img src="../images/return-home-button.png" alt="" />
      </a>

      <p class="art-counter" aria-live="polite"><span data-current>1</span>/<span data-total>5</span></p>

      <section class="artwork-stage" aria-label="Artwork gallery">
        <img class="artwork-image" data-artwork-image src="../images/art/art-01.jpeg" alt="Art installation" />
        <div class="artwork-index" data-artwork-index aria-label="Artwork index"></div>
      </section>

      <button class="gallery-arrow gallery-arrow--previous" type="button" aria-label="Previous artwork">←</button>
      <button class="gallery-arrow gallery-arrow--next" type="button" aria-label="Next artwork">→</button>

      <aside class="index-card" data-index-card hidden aria-live="polite">
        <button class="index-card__close" type="button" aria-label="Close index card">×</button>
        <img data-card-image src="" alt="" />
        <p data-card-title></p>
      </aside>
    </main>
    <script src="art-data.js"></script>
    <script src="art.js"></script>
    <script src="../site-transition.js"></script>
  </body>
</html>
