<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Touch Me — an interactive work by Noah Paul Hage." />
    <title>Touch Me — Noah Paul Hage</title>
    <link rel="icon" href="../favicon-bridgeig.png" type="image/png" sizes="512x512" />
    <link rel="stylesheet" href="touchme.css" />
  </head>
  <body class="touchme-page">
    <main class="touchme-experience" aria-label="Touch Me interactive artwork">
      <a class="touchme-home" href="../" aria-label="Return to homepage" data-page-link>
        <img src="../images/return-home-button.png" alt="" />
      </a>
      <button class="touchme-object" type="button" aria-label="Touch the current image" aria-live="polite">
        <img class="touchme-object__image" src="" alt="" />
      </button>
    </main>
    <script src="../site-transition.js"></script>
    <script src="touchme-data.js"></script>
    <script src="touchme.js"></script>
  </body>
</html>
